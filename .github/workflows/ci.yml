name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: go.sum

      - name: Scan for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.27.2
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL "$release_url/$archive" -o "$tool_dir/$archive"
          curl -fsSL "$release_url/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$tool_dir/checksums.txt"
          cd "$tool_dir"
          grep "  $archive$" checksums.txt | sha256sum --check -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner "$GITHUB_WORKSPACE"
          ./gitleaks dir --redact --no-banner "$GITHUB_WORKSPACE"

      - name: Check Go code
        shell: bash
        run: |
          test -z "$(gofmt -l *.go)"
          go mod download
          go mod verify
          go test -race -count=1 ./...
          go vet ./...
          go build -trimpath ./...

      - name: Check container
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config --no-interpolate --quiet
          docker build -t localm:ci .
          container_name="localm-ci-${GITHUB_RUN_ID}"
          trap 'docker rm --force "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container_name" --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 \
            --env API_KEYS=ci-smoke-value-not-a-secret \
            --publish 127.0.0.1:18080:8080 localm:ci
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:18080/healthz >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:18080/v1/models)" = "401"

  publish:
    name: Publish image
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push=true,oci-artifact=false
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name == 'main' && 'prod' || 'dev' }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name == 'main' && 'prod' || 'dev' }}-${{ github.sha }}
          provenance: mode=max
          sbom: true
