# Private SearXNG for LocalM's /v1/search. Only LocalM reaches it (it has no published port), so
# the limiter meant for public instances is off and the JSON format LocalM reads is on.
use_default_settings: true

general:
  instance_name: "LocalM research"
  enable_metrics: false

server:
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0

engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: wikipedia
    disabled: false
  - name: openstreetmap
    disabled: false
