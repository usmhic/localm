# A complete local AI stack behind LocalM: models, embeddings and web research on your own
# machine, reachable through one authenticated port. Start it with scripts/stack.sh, which
# creates the keys, pulls the models and checks everything (docs/local-stack.md).
#
#   ollama    the models (OpenAI-compatible API), private to this network
#   searxng   private web search for /v1/search, private to this network
#   localm    the only published port: keys, limits, queueing, routing, research
#   tunnel    optional (profile "tunnel"): a Cloudflare tunnel to reach LocalM over HTTPS
name: localm-stack

services:
  ollama:
    image: ollama/ollama:0.40.15
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  searxng:
    image: searxng/searxng:2026.10.27-b5ed73fcb
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run scripts/stack.sh up, which creates it}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  localm:
    image: localm:stack
    build:
      context: ../..
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    depends_on: [searxng]
    environment:
      API_KEYS: ${LOCALM_API_KEYS:?run scripts/stack.sh up, which creates it}
      ALLOWED_MODELS: ${LOCALM_ALLOWED_MODELS:?run scripts/stack.sh up, which sets it}
      LLM_PROVIDER: ollama
      # http://host.docker.internal:11434 when Ollama runs natively (a Mac); the container otherwise.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      SEARCH_BASE_URL: http://searxng:8080
      # Agents send long prompts and want long answers; a local model can take minutes.
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-8388608}
      MAX_TOKENS: ${MAX_TOKENS:-8192}
      DEFAULT_MAX_TOKENS: ${DEFAULT_MAX_TOKENS:-2048}
      UPSTREAM_TIMEOUT: ${UPSTREAM_TIMEOUT:-10m}
      SERVER_WRITE_TIMEOUT: ${SERVER_WRITE_TIMEOUT:-11m}
      # As many requests as Ollama runs at once, plus a short line that waits instead of a 429.
      MAX_CONCURRENT_LLM: ${OLLAMA_NUM_PARALLEL:-2}
      MAX_QUEUED_LLM: ${MAX_QUEUED_LLM:-6}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-60s}
      RATE_LIMIT_PER_KEY_RPM: ${RATE_LIMIT_PER_KEY_RPM:-600}
      RATE_LIMIT_PER_IP_RPM: ${RATE_LIMIT_PER_IP_RPM:-600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # This machine only; the tunnel (or your VPN) is how anything else gets in.
      - "${LOCALM_BIND_ADDRESS:-127.0.0.1}:${LOCALM_PORT:-8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65532:65532"

  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    profiles: [tunnel]
    depends_on: [localm]
    # With CLOUDFLARE_TUNNEL_TOKEN: your named tunnel (route its hostname to http://localm:8080).
    # Without it: a quick tunnel on a random trycloudflare.com address, for trying it out.
    command: ${CLOUDFLARE_TUNNEL_COMMAND:-tunnel --no-autoupdate --url http://localm:8080}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  ollama-models:
