# LocalM in front of the models on this machine. Ollama runs natively (it gets the GPU on every
# platform); LocalM adds the API key, limits and an OpenAI-compatible API in front of it.
# scripts/serve.sh writes .env and starts this (docs/laptop.md).
#
#   bridge   LocalM, published on this machine only
#   tunnel   optional (profile "tunnel"): a Cloudflare tunnel so a server elsewhere can reach it
name: localm

services:
  bridge:
    image: ghcr.io/usmhic/localm:${LOCALM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: missing
    env_file:
      - .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-}
    ports:
      - "${LOCALM_BIND_ADDRESS:-127.0.0.1}:${LOCALM_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    pids_limit: 128
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunnel]
    restart: unless-stopped
    depends_on: [bridge]
    # With CLOUDFLARE_TUNNEL_TOKEN: your named tunnel (a fixed hostname; route it to
    # http://bridge:8080, or http://127.0.0.1:8080 on Linux). Without it: a quick tunnel on a new
    # random trycloudflare.com address each time it starts.
    command: ${CLOUDFLARE_TUNNEL_COMMAND:-tunnel --no-autoupdate --url http://bridge:8080}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
